services:
  - type: web
    name: oantuti-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oantuti-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: REGISTRATION_CODE
        sync: false
      - key: REGISTRATION_OPEN
        value: "true"
      - key: MATCHES_ENABLED
        value: "false"
      - key: MATCH_MAX_MOVES
        value: "200"
      - key: EVENT_TIMEZONE
        value: Asia/Ho_Chi_Minh

databases:
  - name: oantuti-db
    databaseName: oantuti
    user: oantuti
    plan: free
    region: singapore
